schema_version: "1.0"
sources:
  - schema_version: "2.0"
    source_id: src_tatoeba_text
    source_name: Tatoeba sentence corpus text
    owner: Tatoeba Project
    source_type: dataset
    source_url: https://tatoeba.org/en/
    description: >-
      Individual Tatoeba text sentences only, used only when their record-level license,
      author, sentence ID, and attribution data are retained.
    content_types: [text, metadata]
    access:
      preferred_method: official_download
      api_url: https://api.tatoeba.org/
      dataset_url: https://tatoeba.org/en/downloads
      crawl_allowed: false
      download_allowed: true
    license:
      name: CC-BY-2.0-FR
      url: https://creativecommons.org/licenses/by/2.0/fr/deed.en
      reviewed_at: "2026-08-30T00:00:00Z"
      notes: >-
        Default sentence license; some records have a different compatible license. The
        record-level license and contributor attribution control. Audio is excluded.
    permissions: &open_text_permissions
      reference_allowed: true
      ingest_allowed: true
      store_allowed: true
      modify_allowed: true
      redistribute_allowed: true
      commercial_use_allowed: true
    media_permissions:
      text: &open_text
        ingest_allowed: true
        store_allowed: true
        redistribute_allowed: true
        transform_allowed: true
        transcript_allowed: false
        exercise_allowed: true
        derived_redistribution_allowed: true
      audio: &no_audio
        download_allowed: false
        store_allowed: false
        clip_allowed: false
        transform_allowed: false
        transcript_allowed: false
        timestamp_allowed: false
        exercise_allowed: false
        redistribute_allowed: false
        derived_redistribution_allowed: false
      video: &no_video
        download_allowed: false
        store_allowed: false
        clip_allowed: false
        audio_extraction_allowed: false
        transcript_allowed: false
        timestamp_allowed: false
        exercise_allowed: false
        redistribute_allowed: false
        derived_redistribution_allowed: false
    attribution: &tatoeba_attribution
      required: true
      format: "Sentence {source_record_id} by {author}, Tatoeba, {license_url}"
      requirements: >-
        Preserve sentence ID, contributor/author, source URL, record-level license,
        attribution information, and an indication of modifications.
    technical:
      robots_notes: "Do not crawl pages; use the official API or official download exports."
      rate_limit_notes: "Respect published API limits and do not bypass rate limiting."
      official_api_available: true
      official_dump_available: true
    status: APPROVED
    evidence:
      - url: https://tatoeba.org/en/terms_of_use
        description: "Current Tatoeba text license and attribution terms."
        checked_at: "2026-08-30T00:00:00Z"
      - url: https://tatoeba.org/en/downloads
        description: "Official text-download and API access information."
        checked_at: "2026-08-30T00:00:00Z"
    registered_at: "2026-08-30T00:00:00Z"
    registered_by: M1 source-governance review
    reviewed_at: "2026-08-30T00:00:00Z"
    review_notes: >-
      Approved only for record-level text with complete attribution and license data.
      Do not infer text rights from a related audio record or translation chain.

  - schema_version: "2.0"
    source_id: src_tatoeba_audio_cc_by_4
    source_name: Tatoeba CC BY 4.0 audio recordings
    owner: Tatoeba Project contributors
    source_type: dataset
    source_url: https://tatoeba.org/en/downloads
    description: >-
      Individual audio records whose official metadata explicitly identifies CC BY 4.0
      and supplies the required attribution URL. The separately licensed sentence text
      must be cleared independently before transcript or exercise redistribution.
    content_types: [audio, metadata]
    access:
      preferred_method: official_download
      api_url: https://api.tatoeba.org/
      dataset_url: https://tatoeba.org/en/downloads
      crawl_allowed: false
      download_allowed: true
    license:
      name: CC-BY-4.0
      url: https://creativecommons.org/licenses/by/4.0/legalcode.en
      reviewed_at: "2026-08-30T00:00:00Z"
      notes: "Approval excludes blank, unknown, NC, ND, and offsite-prohibited audio licenses."
    permissions: &open_audio_permissions
      reference_allowed: true
      ingest_allowed: true
      store_allowed: true
      modify_allowed: true
      redistribute_allowed: true
      commercial_use_allowed: true
    media_permissions:
      text: *open_text
      audio: &open_audio
        download_allowed: true
        store_allowed: true
        clip_allowed: true
        transform_allowed: true
        transcript_allowed: true
        timestamp_allowed: true
        exercise_allowed: true
        redistribute_allowed: true
        derived_redistribution_allowed: true
      video: *no_video
    attribution:
      required: true
      format: "Audio {audio_id} by {author}, Tatoeba, CC BY 4.0, {attribution_url}"
      requirements: >-
        Retain audio ID, sentence ID, creator, attribution URL, license notice,
        source link where practical, and modification notice. A transcript also needs
        the linked sentence's independently verified text permission.
    technical:
      robots_notes: "Use official downloads or API only; do not crawl contributor pages."
      rate_limit_notes: "Respect official API limits and use bulk exports only in a later approved ingestion run."
      official_api_available: true
      official_dump_available: true
    status: APPROVED
    evidence:
      - url: https://tatoeba.org/en/downloads
        description: "Official audio metadata fields include license and attribution URL."
        checked_at: "2026-08-30T00:00:00Z"
      - url: https://en.wiki.tatoeba.org/articles/show/choose-audio-license
        description: "Official project guidance for contributor-specific audio licenses."
        checked_at: "2026-08-30T00:00:00Z"
    registered_at: "2026-08-30T00:00:00Z"
    registered_by: M1 source-governance review
    reviewed_at: "2026-08-30T00:00:00Z"
    review_notes: "Approved only after an M2 record-level CC BY 4.0 and attribution check."

