[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "english-master"
version = "0.1.0"
description = "Reproducible validation foundation for English Master learning content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
english-master-validate = "english_master.schema_validation:main"
english-master-ingest = "english_master.ingest:main"
english-master-ingestion-pilot = "english_master.ingestion_pilot.__main__:main"
english-master-normalize = "english_master.normalize:main"
english-master-curriculum-validate = "english_master.curriculum_validate:main"
english-master-curriculum-review = "english_master.curriculum_review.cli:main"
english-master-lesson-generate = "english_master.lesson_generate:main"
english-master-exercise-generate = "english_master.exercise_generate:main"
english-master-exercise-development-batch = "english_master.exercise_development_batch:main"
english-master-qa-engine = "english_master.qa_engine.cli:main"
english-master-export = "english_master.export_packaging.cli:main"
english-master-media-ingestion = "english_master.media_ingestion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/english-master/schemas" = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
